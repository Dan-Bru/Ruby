<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Quick Question</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            transition: background-color 0.5s;
        }

        h1 {
            color: #d02e2e;
            padding: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .btn-container {
            position: relative;
            width: 100vw;
            height: 60vh;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            position: absolute;
            left: 50%;
            top: 20%;
            transform: translateX(-110%);
            z-index: 5;
            transition: all 0.2s ease-in-out;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            left: 50%;
            top: 20%;
            transform: translateX(10%);
            transition: 0.15s ease-out;
            z-index: 10;
        }

        #result {
            display: none;
            text-align: center;
            z-index: 20;
        }

        .love-text {
            color: #d02e2e;
            font-size: 3rem;
            font-weight: bold;
            animation: heartBeat 1.2s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="quiz">
        <h1 id="question">Will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="result">
        <div class="love-text">Yay! I love you 😍</div>
    </div>

    <script>
        let yesScale = 1;
        let noClicks = 0;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const padding = 30; 
            
            // 1. Move the No Button
            const maxWidth = window.innerWidth - noBtn.offsetWidth - padding;
            const maxHeight = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxWidth));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxHeight));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.transform = 'none'; 

            // 2. Grow the Yes Button
            yesScale += 0.15; // Grows by 15% each time
            yesBtn.style.transform = `translateX(-110%) scale(${yesScale})`;
            
            // 3. Optional: Change No button text to be funny
            noClicks++;
            const phrases = ["No", "Are you sure?", "Really?", "Think again!", "You're misclicking!", "Pffft", "Try harder"];
            noBtn.innerText = phrases[noClicks % phrases.length];
        }

        function celebrate() {
            // Hide the quiz
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.body.style.backgroundColor = '#ffb6c1';

            // Launch Confetti!
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              // since particles fall down, start a bit higher than random
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
