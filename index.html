<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            color: #d02e2e;
            font-size: 1.8rem;
            margin-bottom: 30px;
            padding: 0 20px;
            position: absolute;
            top: 20%;
            width: 100%;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 20;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            transition: transform 0.2s ease-in-out;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: relative; /* Starts in flow, then goes absolute */
            transition: 0.1s ease-out;
        }

        #result {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .love-text {
            color: #d02e2e;
            font-size: 2.5rem;
            font-weight: bold;
            animation: heartBeat 1.2s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="quiz">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="result">
        <div class="love-text">Yay! I love you 😍</div>
    </div>

    <script>
        let yesScale = 1;
        let noClicks = 0;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // Switch to absolute once it starts moving to ensure it can go anywhere
            noBtn.style.position = 'absolute';
            
            // Boundary math: Keep button at least 50px away from edges
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // Clamp the random values between padding and max width/height
            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Grow Yes Button
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;

            // Change phrases
            noClicks++;
            const phrases = ["No", "Rude", "Try again", "Wrong!", "Nice try", "Nope", "Error 404"];
            noBtn.innerText = phrases[noClicks % phrases.length];
        }

        function celebrate() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.body.style.backgroundColor = '#ffb6c1';

            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
