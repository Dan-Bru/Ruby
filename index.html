<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Force everything to center no matter what */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
        }

        h1 {
            color: #d02e2e;
            font-size: 1.8rem;
            margin-bottom: 30px;
            padding: 0 10px;
            width: 100%;
        }

        /* This container keeps the buttons from pushing the text */
        .btn-holder {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 150px; 
            width: 100%;
            position: relative;
        }

        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            z-index: 100;
            transition: transform 0.1s ease;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            z-index: 50;
        }

        /* Success Screen */
        #result {
            display: none; /* Changed to flex in JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffb6c1;
            z-index: 1000;
        }

        .love-text {
            color: #d02e2e;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .couple-img {
            width: 80%;
            max-width: 350px;
            border: 5px solid white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: block; /* Ensures it renders */
        }
    </style>
</head>
<body>

    <div id="quiz" class="main-wrapper">
        <h1 id="question">Will you be my Valentine? ❤️</h1>
        <div class="btn-holder">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onclick="moveButton()" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <div id="result">
        <div class="love-text">Yay! I love you 😍</div>
        <img src="danandruby.jpg" alt="Us" class="couple-img">
    </div>

    <script>
        let yesScale = 1;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');

            // Make it move anywhere on screen
            noBtn.style.position = 'fixed';
            
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Grow Yes Button
            yesScale += 0.35;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function celebrate() {
            // Hide the quiz, show the result
            document.getElementById('quiz').style.display = 'none';
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'flex';

            // Confetti
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
