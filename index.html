<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        #quiz {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        h1 {
            color: #d02e2e;
            font-size: 2rem;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 50px; /* Keeps initial layout stable */
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 20;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            transition: transform 0.2s ease-in-out;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: relative;
            transition: 0.1s ease-out;
        }

        /* Result Screen Styles */
        #result {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 1s ease-in;
        }

        .love-text {
            color: #d02e2e;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .couple-img {
            max-width: 90%;
            max-height: 60vh;
            border-radius: 20px;
            border: 8px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            object-fit: cover;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="quiz">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="result">
        <div class="love-text">Yay! I love you 😍</div>
        <img src="danandruby.jpg" alt="Us" class="couple-img">
    </div>

    <script>
        let yesScale = 1;
        let noClicks = 0;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            noBtn.style.position = 'absolute';
            
            const padding = 60; 
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Grow Yes Button
            yesScale += 0.3;
            yesBtn.style.transform = `scale(${yesScale})`;

            // Funny Phrases
            noClicks++;
            const phrases = ["No", "Rude", "Try again", "Wrong button!", "Nice try", "Nope", "Click YES"];
            noBtn.innerText = phrases[noClicks % phrases.length];
        }

        function celebrate() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.body.style.backgroundColor = '#ffb6c1';
            document.body.style.overflow = 'auto'; // Allow scrolling to see the full photo if needed

            // Pro Confetti Burst
            const count = 200;
            const defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
              confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
              }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }
    </script>
</body>
</html>
