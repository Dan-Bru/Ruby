<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers horizontally */
            justify-content: center; /* Centers vertically */
            min-height: 100vh;
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        #quiz {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: #d02e2e;
            font-size: 1.8rem;
            margin-bottom: 30px;
            padding: 0 20px;
            width: 100%;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            width: 100%;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 20;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            transition: transform 0.2s ease-in-out;
            position: relative;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: relative;
            transition: 0.1s ease-out;
        }

        /* Result Screen */
        #result {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }

        .love-text {
            color: #d02e2e;
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .couple-img {
            width: 85%;
            max-width: 400px; /* Limits size on desktop */
            border-radius: 20px;
            border: 6px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="quiz">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="result">
        <div class="love-text">Yay! I love you 😍</div>
        <img src="danandruby.jpeg" alt="Us" class="couple-img">
    </div>

    <script>
        let yesScale = 1;
        let noClicks = 0;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // On the first "miss", make it absolute so it can jump anywhere
            if (noBtn.style.position !== 'absolute') {
                noBtn.style.position = 'absolute';
            }
            
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            yesScale += 0.3;
            yesBtn.style.transform = `scale(${yesScale})`;

            noClicks++;
            const phrases = ["No", "Rude", "Try again", "Nope!", "Wrong one", "Click Yes!"];
            noBtn.innerText = phrases[noClicks % phrases.length];
        }

        function celebrate() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.body.style.backgroundColor = '#ffb6c1';
            
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
